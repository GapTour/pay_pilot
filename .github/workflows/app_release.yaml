name: Build macOS and Android

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*+*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true

      - name: Create variables.env file
        run: echo "${{ secrets.DEV_ENV_VARS }}" > variables.env
        shell: bash

      - run: flutter pub get

      - run: flutter config --enable-macos-desktop

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          APP_PATH=$(find . -maxdepth 1 -name "*.app" -type d | head -n 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$APP_NAME-macos.zip"
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          cp "$APP_NAME-macos.zip" "$GITHUB_WORKSPACE/release-artifacts/"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: release-artifacts/*.zip

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install NDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;29.0.13113456"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true

      - name: Create variables.env file
        run: echo "${{ secrets.DEV_ENV_VARS }}" > variables.env
        shell: bash

      - run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Prepare Android artifact
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/pay-pilot-android.apk

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: release-artifacts/*.apk

  release:
    name: Upload Release Assets
    runs-on: ubuntu-latest
    needs:
      - build-macos
      - build-android

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Upload assets to one GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
