name: Build macOS and Android

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true

      - run: flutter pub get

      - name: Create variables.env file
        run: |
          echo "${{ secrets.DEV_ENV_VARS }}" > variables.env
        shell: bash

      - run: flutter config --enable-macos-desktop

      - name: Build macOS release
        run: flutter build macos --release

      - name: Package macOS app
        run: |
          cd build/macos/Build/Products/Release
          APP_PATH=$(find . -maxdepth 1 -name "*.app" -type d | head -n 1)
          APP_NAME=$(basename "$APP_PATH" .app)
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$APP_NAME-macos.zip"
          echo "MACOS_ZIP=build/macos/Build/Products/Release/$APP_NAME-macos.zip" >> "$GITHUB_ENV"

      - name: Upload macOS release asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.MACOS_ZIP }}

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          cache: true

      - run: flutter pub get

      - name: Create variables.env file
        run: |
          echo "${{ secrets.DEV_ENV_VARS }}" > variables.env
        shell: bash

      - name: Build Android APK
        run: flutter build apk --release

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk release-artifacts/pay-pilot-android.apk

      - name: Upload Android release asset
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/pay-pilot-android.apk
